# Site Settings
name: CoffeeAlgorithm
title: CoffeeAlgorithm 
description: CoffeeAlgorithm is the CISUC's junior series.
tags:
  - blog
  - template
  - jekyll
  - theme
  - netlify
email: bruno.direito@uc.pt
disqus_username: disqus_username
show_hero: false
menu:
  - title: Home
    url: /
  - title: About
    url: /about
  - title: Feed
    url: /feed.xml

# Social Media Settings
# Remove the item if you don't need it
github_username: github_username
facebook_username: facebook_username
twitter_username: twitter_username
linkedin_username: linkedin_username

# Posts Settings
show_time_bar: false
show_modal_on_exit: false
show_modal_on_finish_post: false
two_columns_layout: true

# Advanced Settings
url: "https://brunoleitao.github.io"
baseurl: "/cisuc-junior-series"
google_analytics: "UA-XXXXXXXX-X"
language: "en"
categories_folder: category


# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/
collections:
  authors:
    output: true
paginate_path: "/page/:num/"
show_get_theme_btn: false
use_logo: false

# Content paginator
paginate_content:
  enabled: true
  debug: false
  collections:
    - posts
  auto: false
  separator: "--page-break--"
  permalink: "/:num/"
  seo_canonical: true
  properties:
    part:
      is_generated: true
    last:
      is_generated: true
    single:
      is_generated: true

# SASS
sass:
  style: compressed

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-paginate-content
  